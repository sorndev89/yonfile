<!DOCTYPE html>
<html lang="lo">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ໂຍນໄຟລ໌ (YonFile) — ເປີດເວັບ ເຫັນກັນ ໂຍນໄຟລ໌ທັນທີ ປອດໄພ ໄວແຮງ ບໍ່ຕ້ອງລົງແອັບ">
  <meta name="theme-color" content="#10192D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YonFile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ໂຍນໄຟລ໌ (YonFile)</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #10192D;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #10192D;
      font-family: 'Noto Sans Lao', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #F8FAFC;
      z-index: 9999;
      transition: opacity .4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .brand-mark {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      object-fit: contain;
      animation: arrive .65s ease-out both;
    }
    .brand {
      margin-top: 12px;
      font-size: 30px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.8px;
    }
    .brand span { color: #ff6a00; }
    .tagline { margin-top: 8px; font-size: 13px; color: #aebbd0; }
    .loader {
      width: 28px;
      height: 28px;
      margin-top: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255, 107, 0, .22);
      border-top-color: #ff6a00;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="loading">
    <img class="brand-mark" src="icons/Icon-192.png" alt="YonFile logo">
    <div class="brand">Yon<span>File</span></div>
    <div class="tagline">ສົ່ງໄຟລ໌ລະຫວ່າງອຸປະກອນ ງ່າຍ ແລະ ໄວ</div>
    <div class="loader" aria-label="ກຳລັງເປີດ"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 450);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
